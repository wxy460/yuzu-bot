[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "maimai-qq-bot"
version = "0.1.0"
description = "Extensible maimai score and chat bot using the official QQ Bot API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "Pillow>=11,<13",
  "qqbot-agent-sdk>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
maimai-bot = "maimai_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maimai_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
